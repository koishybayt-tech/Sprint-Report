# Локальный запуск без HTTPS-Caddy:
#   api и web — только на этом компьютере: http://localhost:${WEB_PORT:-3000}, API на :${API_PORT:-8080};
#   для коллег в офисной сети — http://<IP компьютера>:${LAN_PORT:-80} с логином и паролем (сервис gate).
# docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml --env-file deploy/.env up -d --build
# Если порт занят: API_PORT=18080 WEB_PORT=13000 LAN_PORT=8081 docker compose ...
services:
  api:
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
  web:
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
  caddy:
    profiles: ["prod"]   # HTTPS-Caddy с доменом не запускается без --profile prod
  gate:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["${LAN_PORT:-80}:80"]
    environment:
      LAN_USER: ${LAN_USER:?set in .env}
      LAN_PASSWORD_HASH: ${LAN_PASSWORD_HASH:?set in .env — bcrypt, см. DEPLOY.md}
    volumes:
      - ./Caddyfile.lan:/etc/caddy/Caddyfile:ro
    depends_on: [api, web]
